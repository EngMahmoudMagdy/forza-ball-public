<body class="bg-surface text-on-surface font-body overflow-hidden">
<!-- Blurred Background Content (Profile Screen Placeholder) -->
<div class="fixed inset-0 z-0 blur-xl opacity-40 flex flex-col">
<!-- TopAppBar Placeholder -->
<header class="flex items-center justify-between px-6 py-4 w-full bg-[#131f16]">
<span class="text-xl font-black italic text-[#29a847] tracking-widest uppercase">EMERALD PITCH</span>
<span class="material-symbols-outlined text-[#29a847]">search</span>
</header>
<main class="flex-1 p-6 space-y-8">
<div class="flex flex-col items-center text-center space-y-4">
<div class="w-24 h-24 rounded-full bg-surface-container-highest border-2 border-primary-container"></div>
<div class="space-y-1">
<h1 class="text-2xl font-bold tracking-tight">ALEX HUNTER</h1>
<p class="text-[10px] font-bold uppercase tracking-[0.05em] text-primary">Season Pass Holder</p>
</div>
</div>
<div class="space-y-3">
<div class="h-16 w-full bg-surface-container rounded-xl"></div>
<div class="h-16 w-full bg-surface-container rounded-xl"></div>
<div class="h-16 w-full bg-surface-container rounded-xl"></div>
<div class="h-16 w-full bg-surface-container rounded-xl"></div>
</div>
</main>

<nav class="fixed bottom-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-[#131f16]/80">
<div class="flex flex-col items-center text-slate-500"><span class="material-symbols-outlined">home</span></div>

<div class="flex flex-col items-center text-[#29a847]"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span></div>
</nav>
</div>
<!-- Modal Backdrop -->
<div class="fixed inset-0 z-[60] bg-surface-container-lowest/80 backdrop-blur-sm flex items-center justify-center p-6">
<!-- Confirmation Dialog -->
<div class="w-full max-w-sm bg-surface-container-high rounded-3xl overflow-hidden shadow-2xl ring-1 ring-outline-variant relative">
<!-- Glass Header Graphic -->
<div class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-b from-primary/10 to-transparent pointer-events-none"></div>
<div class="relative p-8 flex flex-col items-center text-center">
<!-- Icon/Brand Element -->
<div class="mb-6 w-16 h-16 rounded-full bg-error-container flex items-center justify-center shadow-[0_0_20px_rgba(239,68,68,0.2)]">
<span class="material-symbols-outlined text-error text-3xl" style="font-variation-settings: 'FILL' 1;">logout</span>
</div>
<!-- Content -->
<div class="space-y-3 mb-8">
<h2 class="text-2xl font-black italic uppercase tracking-tight text-on-surface">Logout?</h2>
<p class="text-on-surface-variant leading-relaxed">
                        Are you sure you want to log out of <span class="text-primary font-bold">ForzaBall App</span>?
                    </p>
</div>

<div class="flex flex-col w-full gap-3">
<button class="w-full py-4 bg-tertiary text-on-tertiary font-bold rounded-xl shadow-lg shadow-tertiary/20 active:scale-95 transition-all duration-200 uppercase tracking-widest text-sm">
                        Logout
                    </button>
<button class="w-full py-4 bg-surface-container-highest text-on-surface font-bold rounded-xl active:scale-95 transition-all duration-200 uppercase tracking-widest text-sm hover:bg-surface-bright">
                        Cancel
                    </button>

<div class="h-1 bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>
