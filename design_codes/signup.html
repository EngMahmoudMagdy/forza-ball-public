<!DOCTYPE html>

<html class="dark" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#29a847",
                        "background-light": "#f6f8f6",
                        "background-dark": "#131f16",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <title>ForzaBall - Sign Up</title>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
    <div class="flex items-center bg-background-light dark:bg-background-dark p-4 justify-between">
        <button class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="flex-1 flex justify-center pr-12">
            <img alt="ForzaBall Logo" class="h-8 w-auto" data-alt="ForzaBall app logo with football elements" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDD1kIUKKmC7wGGyD5FvJoLXpsUW-0zkYr_Z09vH8OO3TT3TTbusnAhtGq9TGF3H5gX0EEqrK4LhSY-FjZ-JlDWsPuSeOxiGWbbsFJXYn-74VFQ6FvGtFK_ABIfiYWY8kDxfIA8dVNh5rosv6oi99_D_CtdCB_62mnVSalHHOvIfg2osWbK5ZHeob0AAEIY0lKofsha4h5ybH9skxs40muMR_qNPif_Uavq-RUf5pWsy66kEJEi8IvSCTL9WDJl5plbDe29v6q2kz2L"/>
        </div>
    </div>
    <div class="px-4 pt-4">
        <div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden rounded-xl min-h-[180px] bg-primary/10 border border-primary/20" data-alt="Cinematic wide shot of a green football stadium at night" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAkm2vVPUcgND8KKgQ2Bb3XSqwVhtaJkGasOFbtSTSKoSwV-zvvGpfjBJKsYbNKFMh_ZCEGuw2_xMIasx4w-iO5rWzcTeDaqUhkKceVvQ6Zbqa5MWVdcXmpXN1xS-b3JCnqwc-Yp64BgwTxmAwWbI_LpPeVLoujaeLsNr3XK8UB-BoXqq-PF-wV_ygPvPAIfPeckbfw_S-fycCbLVvE_Ftx7bBN0hjO7VSDArT2D0ckuXYyFcVWzTCAE5obCnugEqIDNOiYXrh1mXvc");'>
        </div>
    </div>
    <div class="flex flex-col px-6 pt-8 pb-4">
        <h1 class="text-slate-900 dark:text-white text-3xl font-bold leading-tight text-center">Sign Up</h1>
        <p class="text-slate-600 dark:text-slate-400 text-sm text-center mt-2">Join the global football community today</p>
    </div>
    <div class="px-6 py-4">
        <div class="flex h-12 w-full items-center justify-center rounded-xl bg-slate-200 dark:bg-slate-800 p-1">
            <label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 has-[:checked]:bg-primary has-[:checked]:text-white text-slate-600 dark:text-slate-400 text-sm font-semibold transition-all">
                <span>Sign Up</span>
                <input checked="" class="hidden" name="auth-toggle" type="radio" value="Sign Up"/>
            </label>
            <label class="flex cursor-pointer h-full grow items-center justify-center rounded-lg px-2 has-[:checked]:bg-primary has-[:checked]:text-white text-slate-600 dark:text-slate-400 text-sm font-semibold transition-all">
                <span>Log In</span>
                <input class="hidden" name="auth-toggle" type="radio" value="Log In"/>
            </label>
        </div>
    </div>
    <div class="flex flex-col gap-3 px-6 pb-8">
        <button class="flex h-12 w-full items-center justify-center gap-3 rounded-xl bg-primary text-white font-bold hover:bg-primary/90 transition-colors">
            <span class="material-symbols-outlined">mail</span>
            Continue with Email
        </button>
        <button class="flex h-12 w-full items-center justify-center gap-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
            <span class="material-symbols-outlined">call</span>
            Continue with Phone
        </button>
        <div class="relative my-4 flex items-center">
            <div class="flex-grow border-t border-slate-300 dark:border-slate-700"></div>
            <span class="mx-4 text-xs font-medium text-slate-500 uppercase">Or connect with</span>
            <div class="flex-grow border-t border-slate-300 dark:border-slate-700"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <button class="flex h-12 items-center justify-center gap-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                <svg class="h-5 w-5" viewbox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                </svg>
                <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Google</span>
            </button>
            <button class="flex h-12 items-center justify-center gap-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                <svg class="h-5 w-5 fill-slate-900 dark:fill-white" viewbox="0 0 24 24">
                    <path d="M17.05 20.28c-.98.95-2.05 1.78-3.3 1.72-1.25-.06-1.63-.82-3.13-.82s-1.93.76-3.1.84c-1.25.06-2.45-.92-3.41-1.87-1.94-1.92-3.41-5.41-3.41-8.54 0-3.14 1.94-5.32 3.86-5.32 1.04 0 1.94.67 2.58.67.63 0 1.73-.78 2.94-.78 1.43 0 2.58.74 3.26 1.72-2.84 1.52-2.38 5.76.5 6.89-.63 1.71-1.52 3.41-2.79 4.49zm-4.31-15.52c-.15-2.46 2.03-4.63 4.41-4.76.22 2.65-2.19 4.88-4.41 4.76z"></path>
                </svg>
                <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Apple</span>
            </button>
        </div>
    </div>
    <div class="mt-auto px-6 py-6 text-center">
        <p class="text-xs text-slate-500 leading-relaxed">
            By continuing, you agree to ForzaBall's <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
        </p>
    </div>
    <nav class="sticky bottom-0 flex gap-2 border-t border-slate-200 dark:border-slate-800 bg-background-light dark:bg-background-dark px-4 pb-6 pt-2">
        <a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400" href="#">
            <span class="material-symbols-outlined">newspaper</span>
            <p class="text-[10px] font-medium leading-normal">News</p>
        </a>
        <a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400" href="#">
            <span class="material-symbols-outlined">sports_soccer</span>
            <p class="text-[10px] font-medium leading-normal">Matches</p>
        </a>
        <a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400" href="#">
            <span class="material-symbols-outlined">format_list_numbered</span>
            <p class="text-[10px] font-medium leading-normal">Standings</p>
        </a>
        <a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="#">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">account_circle</span>
            <p class="text-[10px] font-medium leading-normal">Profile</p>
        </a>
    </nav>
</div>
</body></html>
