<!DOCTYPE html>

<html class="dark" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ForzaBall - Complete Your Profile</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#29a847",
                        "background-light": "#f6f8f6",
                        "background-dark": "#131f16",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto">
    <!-- Top App Bar -->
    <div class="flex items-center p-4 pb-2 justify-between">
        <div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center cursor-pointer">
            <span class="material-symbols-outlined text-2xl">arrow_back</span>
        </div>
        <h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Complete Your Profile</h2>
    </div>
    <!-- Progress Bar Section -->
    <div class="flex flex-col gap-3 p-4">
        <div class="flex gap-6 justify-between">
            <p class="text-slate-900 dark:text-slate-100 text-base font-medium leading-normal">Personalization</p>
            <p class="text-slate-900 dark:text-slate-100 text-sm font-normal leading-normal">Step 3 of 3</p>
        </div>
        <div class="rounded-full bg-primary/20 h-2 w-full overflow-hidden">
            <div class="h-full rounded-full bg-primary" style="width: 100%;"></div>
        </div>
    </div>
    <!-- Content Area -->
    <div class="flex flex-col flex-1">
        <!-- Profile Photo Upload -->
        <div class="flex p-6 @container">
            <div class="flex w-full flex-col gap-6 items-center">
                <div class="flex gap-4 flex-col items-center">
                    <div class="relative">
                        <div class="bg-primary/10 border-2 border-dashed border-primary/40 aspect-square rounded-full flex items-center justify-center min-h-32 w-32 overflow-hidden bg-center bg-no-repeat bg-cover" data-alt="Placeholder for user profile photograph" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA50rJJ1-a9ZQqF2MBVOCe_gFGlVzXF5Mb0S40Tdf4RvUJ24JYNsFxleOS-V70Pv3G8VbQujOXpaactRo6IrdEnUgUk3n1I7Y-f269iXd43h2lpQXY7PXNjVjFTRfdPkZgmkTPkf_E9zpQV-f0l5C4xzdgQw5vUGysKJSVFIsT31QRGxXIripCb0Ar-KosgpOq50VvzGSwEZXf8FvGlhYXKNN4cIHC5I9xYKZReU7uXlNwwaIuAD7sXolMM8wEdX2haZtUXY8gAzL7t")'>
                            <!-- Fallback icon if no image -->
                            <div class="absolute inset-0 flex items-center justify-center bg-background-dark/40">
                                <span class="material-symbols-outlined text-4xl text-white">add_a_photo</span>
                            </div>
                        </div>
                        <div class="absolute bottom-0 right-0 bg-primary text-white p-2 rounded-full shadow-lg flex items-center justify-center border-2 border-background-dark">
                            <span class="material-symbols-outlined text-sm">edit</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-center justify-center">
                        <p class="text-slate-900 dark:text-slate-100 text-[22px] font-bold leading-tight tracking-tight text-center">Upload Photo</p>
                        <p class="text-slate-500 dark:text-primary/60 text-base font-normal leading-normal text-center mt-1">Add a photo so teammates can find you</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Nickname Input -->
        <div class="flex flex-col gap-4 px-4 py-3">
            <label class="flex flex-col w-full">
                <p class="text-slate-900 dark:text-slate-100 text-base font-medium leading-normal pb-2">Nickname</p>
                <div class="flex w-full items-stretch rounded-lg shadow-sm">
                    <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-primary border border-primary/20 dark:border-primary/30 bg-white dark:bg-background-dark/50 h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-[15px] border-r-0 text-base font-normal leading-normal" placeholder="Enter your nickname" type="text"/>
                    <div class="text-slate-400 dark:text-primary/60 flex border border-primary/20 dark:border-primary/30 bg-white dark:bg-background-dark/50 items-center justify-center pr-[15px] rounded-r-lg border-l-0">
                        <span class="material-symbols-outlined">person</span>
                    </div>
                </div>
            </label>
            <!-- Optional Bio or additional context -->
            <div class="mt-2 p-4 rounded-xl bg-primary/5 border border-primary/10">
                <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
                    Your nickname will be visible on the ForzaBall leaderboards and your player card during match lineups.
                </p>
            </div>
        </div>
    </div>
    <!-- Footer Button -->
    <div class="p-4 mt-auto">
        <button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-white text-lg font-bold leading-normal tracking-wide shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
            <span class="truncate">Finish</span>
        </button>
        <div class="h-6"></div>
    </div>
</div>
</body></html>
